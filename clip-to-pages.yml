name: Clip YouTube Video & Publish HTML Page

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL (10s - 5h)"
        required: true
      clips:
        description: "Number of Shorts"
        required: true
        default: "3"
      mode:
        description: "Framing mode (crop or blur)"
        required: true
        default: "crop"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Run AI YouTube Shorts Clipper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py "${{ inputs.url }}" --clips "${{ inputs.clips }}" --mode "${{ inputs.mode }}"

      - name: Build HTML page with direct links
        run: |
          python - << 'EOF'
          import html, json
          from pathlib import Path

          site = Path("site")
          site.mkdir(exist_ok=True)

          cards = []
          for meta_file in sorted(Path("output").glob("*/metadata.json")):
              vid = meta_file.parent.name
              vid_dir = site / vid
              vid_dir.mkdir(exist_ok=True)
              items = json.loads(meta_file.read_text(encoding="utf-8"))

              for idx, item in enumerate(items, start=1):
                  src = Path(item["file_path"])
                  if not src.exists():
                      continue
                  dst = vid_dir / src.name
                  dst.write_bytes(src.read_bytes())
                  rel_link = f"{vid}/{src.name}"
                  title = html.escape(item.get("title", f"Short {idx}"))
                  desc = html.escape(item.get("description", ""))
                  tags = html.escape(", ".join(item.get("tags", [])))
                  cards.append(f"""
                  <div class="card">
                    <h3>{title}</h3>
                    <video controls playsinline src="{rel_link}"></video>
                    <p><a href="{rel_link}" download>Direct Download Link ({src.name})</a></p>
                    <p><strong>Description:</strong> {desc}</p>
                    <p><strong>Tags:</strong> {tags}</p>
                  </div>
                  """)

          body = "\n".join(cards) if cards else "<p>No clips generated.</p>"
          page = f"""<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Generated YouTube Shorts</title>
            <style>
              body {{ font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }}
              .card {{ border: 1px solid #ddd; border-radius: 10px; padding: 1rem; margin-bottom: 1.5rem; }}
              video {{ width: 100%; max-height: 480px; background: #000; border-radius: 8px; }}
              a {{ display: inline-block; margin-top: 0.5rem; font-weight: bold; }}
            </style>
          </head>
          <body>
            <h1>Generated YouTube Shorts</h1>
            {body}
          </body>
          </html>"""
          (site / "index.html").write_text(page, encoding="utf-8")
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
